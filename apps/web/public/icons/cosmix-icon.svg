<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cosmix">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="star" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="75%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#space)"/>
  <circle cx="170" cy="160" r="120" fill="url(#nebulaA)"/>
  <circle cx="360" cy="340" r="130" fill="url(#nebulaB)"/>
  <!-- distant stars -->
  <circle cx="96" cy="88" r="3" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="420" cy="110" r="2.5" fill="#bae6fd" opacity="0.8"/>
  <circle cx="80" cy="400" r="2" fill="#fde68a" opacity="0.65"/>
  <circle cx="450" cy="390" r="3" fill="#e2e8f0" opacity="0.55"/>
  <circle cx="250" cy="70" r="2" fill="#fff" opacity="0.5"/>
  <!-- orbital ring -->
  <ellipse cx="256" cy="256" rx="168" ry="62" fill="none" stroke="url(#orbit)" stroke-width="14" transform="rotate(-28 256 256)" opacity="0.95"/>
  <ellipse cx="256" cy="256" rx="168" ry="62" fill="none" stroke="#67e8f9" stroke-width="3" transform="rotate(-28 256 256)" opacity="0.45"/>
  <!-- core star -->
  <circle cx="256" cy="256" r="54" fill="url(#star)"/>
  <circle cx="256" cy="256" r="72" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.35"/>
  <!-- tiny planet on orbit -->
  <circle cx="390" cy="210" r="14" fill="#fdba74"/>
  <circle cx="386" cy="206" r="5" fill="#fff7ed" opacity="0.55"/>
</svg>
